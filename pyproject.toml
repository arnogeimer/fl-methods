[project]
name = "methods"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flwr[simulation]>=1.25.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "black>=25.12.0",
    "flwr-datasets>=0.5.0",
    "ipython>=9.8.0",
    "isort>=7.0.0",
    "jupyter>=1.1.1",
    "multiprocess==0.70.11",
    "pandas>=2.3.3",
    "peft>=0.18.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "timm>=1.0.22",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "transformers>=4.57.3",
    "xgboost>=3.1.3",
]
[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "arnogeimer"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "scripts.server_app:app"
clientapp = "scripts.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 100
fraction-fit = 0.5
fraction-evaluate = 0.0
local-epochs = 10
model = "resnet18"              # model architecture or LLM, optional
batch-size = 64                 # training batch size
learning-rate = 0.01 
num-clients = 25

# Default federation to use when running the app
[tool.flwr.federations]
default = "local-simulation"

# Local simulation federation with x virtual SuperNodes
[tool.flwr.federations.local-simulation]
options.num-supernodes = 25       # number of clients
options.backend.client-resources.num-cpus = 1      # needed to spawn clients successively, not in parallel
options.backend.client-resources.num-gpus = 0.1       # needed to spawn clients successively, not in parallel

# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true  # Remove this line to enable TLS
